AWSTemplateFormatVersion: "2010-09-09"
Description: >
  fullstack-calculator — foundation stack: ECR repository, App Runner ECR
  access role, and an optional GitHub OIDC provider + deploy role scoped to
  this repository's default branch.

Parameters:
  ProjectName:
    Type: String
    Default: fullstack-calculator
    Description: Used to name and tag every resource in this stack.

  GitHubRepository:
    Type: String
    Default: SebasElDev/fullstack-calculator
    Description: "<owner>/<repo> allowed to assume the deploy role via OIDC."

  GitHubBranch:
    Type: String
    Default: main
    Description: Branch allowed to assume the deploy role via OIDC.

  GitHubOwnerId:
    Type: String
    Default: ""
    Description: >
      Numeric id of the repository owner. Repositories created after
      2026-07-15 present an immutable OIDC subject
      (repo:<owner>@<ownerId>/<repo>@<repoId>:ref:refs/heads/<branch>); when
      both ids are given the trust policy pins that subject and nothing else.
      Leave both empty for older repositories that still use the classic
      subject (repo:<owner>/<repo>:ref:refs/heads/<branch>).

  GitHubRepositoryId:
    Type: String
    Default: ""
    Description: Numeric id of the repository (see GitHubOwnerId).

  ServiceStackName:
    Type: String
    Default: fullstack-calculator-service
    Description: >
      Name of the CloudFormation stack that owns the App Runner service
      (deploy/aws/service.yaml). The deploy role may update that stack only.

  CreateGitHubOidcProvider:
    Type: String
    Default: "true"
    AllowedValues: ["true", "false"]
    Description: >
      Set to "false" if the AWS account already has a
      token.actions.githubusercontent.com OIDC provider (an account may only
      have one); the deploy role will then reference the existing provider.

Conditions:
  ShouldCreateOidcProvider: !Equals [!Ref CreateGitHubOidcProvider, "true"]
  UsesImmutableSubject: !And
    - !Not [!Equals [!Ref GitHubOwnerId, ""]]
    - !Not [!Equals [!Ref GitHubRepositoryId, ""]]

Resources:
  EcrRepository:
    Type: AWS::ECR::Repository
    Properties:
      RepositoryName: !Ref ProjectName
      ImageTagMutability: MUTABLE
      ImageScanningConfiguration:
        ScanOnPush: true
      LifecyclePolicy:
        LifecyclePolicyText: !Sub |
          {
            "rules": [
              {
                "rulePriority": 1,
                "description": "Keep last 10 images",
                "selection": {
                  "tagStatus": "any",
                  "countType": "imageCountMoreThan",
                  "countNumber": 10
                },
                "action": { "type": "expire" }
              }
            ]
          }
      Tags:
        - Key: Project
          Value: !Ref ProjectName

  AppRunnerEcrAccessRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${ProjectName}-apprunner-ecr-access"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: build.apprunner.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSAppRunnerServicePolicyForECRAccess
      Tags:
        - Key: Project
          Value: !Ref ProjectName

  GitHubOidcProvider:
    Type: AWS::IAM::OIDCProvider
    Condition: ShouldCreateOidcProvider
    Properties:
      Url: https://token.actions.githubusercontent.com
      ClientIdList:
        - sts.amazonaws.com
      ThumbprintList:
        - 6938fd4d98bab03faadb97b34396831e3780aea1
        - 1c58a3a8518e8759bf075b76b750d4f2df264fcd

  GitHubDeployRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${ProjectName}-github-deploy"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Federated: !If
                - ShouldCreateOidcProvider
                - !Ref GitHubOidcProvider
                - !Sub "arn:aws:iam::${AWS::AccountId}:oidc-provider/token.actions.githubusercontent.com"
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
              StringLike:
                token.actions.githubusercontent.com:sub: !If
                  - UsesImmutableSubject
                  - !Sub
                    - "repo:${Owner}@${GitHubOwnerId}/${Repo}@${GitHubRepositoryId}:ref:refs/heads/${GitHubBranch}"
                    - Owner: !Select [0, !Split ["/", !Ref GitHubRepository]]
                      Repo: !Select [1, !Split ["/", !Ref GitHubRepository]]
                  - !Sub "repo:${GitHubRepository}:ref:refs/heads/${GitHubBranch}"
      Policies:
        - PolicyName: deploy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: EcrAuth
                Effect: Allow
                Action: ecr:GetAuthorizationToken
                Resource: "*"
              - Sid: EcrPushPull
                Effect: Allow
                Action:
                  - ecr:BatchCheckLayerAvailability
                  - ecr:GetDownloadUrlForLayer
                  - ecr:BatchGetImage
                  - ecr:PutImage
                  - ecr:InitiateLayerUpload
                  - ecr:UploadLayerPart
                  - ecr:CompleteLayerUpload
                  - ecr:DescribeRepositories
                  - ecr:DescribeImages
                  - ecr:BatchDeleteImage
                  - ecr:ListImages
                Resource: !GetAtt EcrRepository.Arn
              - Sid: CloudFormationServiceStack
                Effect: Allow
                Action:
                  - cloudformation:CreateStack
                  - cloudformation:UpdateStack
                  - cloudformation:DescribeStacks
                  - cloudformation:DescribeStackEvents
                  - cloudformation:DescribeStackResources
                  - cloudformation:GetTemplate
                  - cloudformation:CreateChangeSet
                  - cloudformation:DescribeChangeSet
                  - cloudformation:ExecuteChangeSet
                  - cloudformation:DeleteChangeSet
                Resource: !Sub "arn:aws:cloudformation:*:${AWS::AccountId}:stack/${ServiceStackName}/*"
              - Sid: AppRunnerCreateAndList
                Effect: Allow
                Action:
                  # The service ARN does not exist before CreateService, and
                  # the List* actions are not resource-scoped.
                  - apprunner:CreateService
                  - apprunner:List*
                Resource: "*"
              - Sid: AppRunnerManageProjectService
                Effect: Allow
                Action:
                  # DeleteService is what CloudFormation needs to roll back or
                  # replace the service during an update; it is scoped to this
                  # project's service ARN only.
                  - apprunner:Describe*
                  - apprunner:UpdateService
                  - apprunner:StartDeployment
                  - apprunner:DeleteService
                  - apprunner:TagResource
                  - apprunner:UntagResource
                Resource: !Sub "arn:aws:apprunner:${AWS::Region}:${AWS::AccountId}:service/${ProjectName}-service/*"
              - Sid: PassAppRunnerAccessRole
                Effect: Allow
                Action: iam:PassRole
                Resource: !GetAtt AppRunnerEcrAccessRole.Arn
      Tags:
        - Key: Project
          Value: !Ref ProjectName

Outputs:
  EcrRepositoryUri:
    Value: !GetAtt EcrRepository.RepositoryUri
  EcrRepositoryName:
    Value: !Ref EcrRepository
  AppRunnerEcrAccessRoleArn:
    Value: !GetAtt AppRunnerEcrAccessRole.Arn
  GitHubDeployRoleArn:
    Value: !GetAtt GitHubDeployRole.Arn
