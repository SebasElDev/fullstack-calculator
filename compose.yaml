services:
  calculator:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VERSION: ${VERSION:-dev}
    image: fullstack-calculator:local
    ports:
      - "8080:8080"
    environment:
      PORT: "8080"
      STATIC_DIR: "/app/public"
    healthcheck:
      test: ["CMD", "/app/api", "-healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
    restart: unless-stopped
