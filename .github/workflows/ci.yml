name: CI

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: gofmt check
        working-directory: backend
        run: |
          fmt_out="$(gofmt -l .)"
          if [ -n "$fmt_out" ]; then
            echo "gofmt found unformatted files:"
            echo "$fmt_out"
            exit 1
          fi

      - name: go vet
        working-directory: backend
        run: go vet ./...

      - name: go test
        working-directory: backend
        run: go test -race -cover ./...

  frontend:
    name: frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: npm ci
        working-directory: frontend
        run: npm ci

      - name: lint
        working-directory: frontend
        run: npm run lint

      - name: typecheck
        working-directory: frontend
        run: npm run typecheck

      - name: test
        working-directory: frontend
        run: npm run test -- --coverage

      - name: build
        working-directory: frontend
        run: npm run build

  docker:
    name: docker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: build (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: false
          load: false
          build-args: |
            VERSION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: deploy
    needs: [backend, frontend, docker]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-${{ github.ref }}
      cancel-in-progress: false
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: configure aws credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: login to ecr
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.ecr-login.outputs.registry }}/${{ vars.ECR_REPOSITORY }}:${{ github.sha }}
          build-args: |
            VERSION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: deploy service stack
        run: |
          aws cloudformation deploy \
            --template-file deploy/aws/service.yaml \
            --stack-name "${{ vars.SERVICE_STACK_NAME }}" \
            --parameter-overrides \
              ImageUri=${{ steps.ecr-login.outputs.registry }}/${{ vars.ECR_REPOSITORY }}:${{ github.sha }} \
              AccessRoleArn=${{ vars.APP_RUNNER_ACCESS_ROLE_ARN }} \
            --capabilities CAPABILITY_NAMED_IAM \
            --no-fail-on-empty-changeset

      - name: wait for app runner service to be running
        run: |
          set -euo pipefail
          service_arn="$(aws cloudformation describe-stacks \
            --stack-name "${{ vars.SERVICE_STACK_NAME }}" \
            --query "Stacks[0].Outputs[?OutputKey=='ServiceArn'].OutputValue" \
            --output text)"

          elapsed=0
          timeout=900
          interval=15

          while true; do
            status="$(aws apprunner describe-service \
              --service-arn "$service_arn" \
              --query "Service.Status" --output text)"
            echo "App Runner service status: $status (elapsed ${elapsed}s)"

            case "$status" in
              RUNNING)
                break
                ;;
              *_FAILED)
                echo "App Runner service entered a failed state: $status"
                exit 1
                ;;
            esac

            if [ "$elapsed" -ge "$timeout" ]; then
              echo "Timed out waiting for App Runner service to reach RUNNING"
              exit 1
            fi

            sleep "$interval"
            elapsed=$((elapsed + interval))
          done

          service_url="$(aws apprunner describe-service \
            --service-arn "$service_arn" \
            --query "Service.ServiceUrl" --output text)"
          echo "Service URL: https://${service_url}"
          echo "### Deployed :rocket:" >> "$GITHUB_STEP_SUMMARY"
          echo "https://${service_url}" >> "$GITHUB_STEP_SUMMARY"
